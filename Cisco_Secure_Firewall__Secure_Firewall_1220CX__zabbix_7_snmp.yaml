zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: 35098f212d114415ad405792ec0a38c1
    template: Cisco Secure Firewall Secure Firewall 1220CX by SNMP
    name: Cisco Secure Firewall Secure Firewall 1220CX by SNMP
    description: 'Zabbix 7.0 SNMP template for Cisco Secure Firewall Secure Firewall 1220CX.


      Scope: conservative vendor-neutral SNMP baseline using SNMPv2-MIB and IF-MIB so the template remains portable across
      firmware revisions.

      Includes ICMP reachability, system identity/uptime, interface discovery, interface state, traffic, errors/discards,
      triggers, and interface graph prototypes.

      No unverified proprietary OIDs are included. Add vendor MIB-specific items only after confirming them against the exact
      firmware/model.


      SNMP support/model evidence:

      - https://www.cisco.com/site/ca/en/products/security/firewalls/index.html

      - https://www.cisco.com/c/en/us/td/docs/security/secure-firewall/mib/cisco-secure-firewall-mib-reference-guide.html'
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 2f196f4f81664076a1cbdcec1a443880
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      delay: 1m
      history: 7d
      trends: 365d
      value_type: UNSIGNED
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 22772478895246f7836c4f439364249f
        expression: max(/Cisco Secure Firewall Secure Firewall 1220CX by SNMP/icmpping,#3)=0
        name: Firewall is unreachable by ICMP
        priority: HIGH
        manual_close: 'YES'
    - uuid: 2b7f5d8c070145279bc98850e535f7f9
      name: ICMP packet loss
      type: SIMPLE
      key: icmppingloss
      delay: 1m
      history: 7d
      trends: 365d
      value_type: FLOAT
      units: '%'
      tags:
      - tag: component
        value: health
    - uuid: 3c88d9cc9c674d7abda88f10d1e2c8e5
      name: ICMP response time
      type: SIMPLE
      key: icmppingsec
      delay: 1m
      history: 7d
      trends: 365d
      value_type: FLOAT
      units: s
      tags:
      - tag: component
        value: health
    - uuid: f5223fb8493941dd838bcbbddb7f2701
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: system.descr[sysDescr.0]
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: system
    - uuid: 9f251d2f4e3e4222b67f5ad30180abe0
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: system.objectid[sysObjectID.0]
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
    - uuid: 8bfc01c8805a429994786229f281ae7e
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: system.uptime[sysUpTime.0]
      delay: 5m
      history: 7d
      trends: 365d
      value_type: UNSIGNED
      units: uptime
      tags:
      - tag: component
        value: system
    - uuid: 85336dc8f20a49f5ab7eef6f82f3c3e3
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: system.contact[sysContact.0]
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
    - uuid: 01763d147f48442dbf057d3a5b37c583
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: system.name[sysName.0]
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
    - uuid: f3b970f3d1f5425ab682dcdf5acd086a
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: system.location[sysLocation.0]
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
    discovery_rules:
    - uuid: 79d2058b1fbd433b8bf0116bd45fb285
      name: Network interfaces discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18]
      key: net.if.discovery
      delay: 1h
      lifetime: 7d
      enabled_lifetime_type: DISABLE_NEVER
      item_prototypes:
      - uuid: 3705ab754d884dd58334c78b7c47a1d5
        name: 'Interface {#IFNAME}: Administrative status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}
        key: net.if.admin[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        valuemap:
          name: Interface status
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 1793239fae2048f6a9c37c5ae84fdcf8
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}
        key: net.if.oper[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        valuemap:
          name: Interface status
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        trigger_prototypes:
        - uuid: 9507947e61964764a4f88c12ba9026fe
          expression: last(/Cisco Secure Firewall Secure Firewall 1220CX by SNMP/net.if.admin[{#SNMPINDEX}])=1 and last(/Cisco
            Secure Firewall Secure Firewall 1220CX by SNMP/net.if.oper[{#SNMPINDEX}])<>1
          name: Interface {#IFNAME} is down
          priority: AVERAGE
          manual_close: 'YES'
      - uuid: c57131d507af4fa180e7b38eb19342c1
        name: 'Interface {#IFNAME}: Speed'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}
        key: net.if.speed[{#SNMPINDEX}]
        delay: 5m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: Mbps
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 1b891a397e1344cc8c7a63de38a0c94d
        name: 'Interface {#IFNAME}: Bits received'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}
        key: net.if.in[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 8399bd28334a43158b8df7bd96973a40
        name: 'Interface {#IFNAME}: Bits sent'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}
        key: net.if.out[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: b35e2a1c81ca476dbbfece4355bcdf83
        name: 'Interface {#IFNAME}: Inbound errors'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}
        key: net.if.in.errors[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: f825ae77b1c840b1a3997db988095533
        name: 'Interface {#IFNAME}: Outbound errors'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}
        key: net.if.out.errors[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: bceed529f16f4b5f86b8248de7d45dc6
        name: 'Interface {#IFNAME}: Inbound discards'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}
        key: net.if.in.discards[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 0112013b623c43a38062c3c086177e73
        name: 'Interface {#IFNAME}: Outbound discards'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}
        key: net.if.out.discards[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      graph_prototypes:
      - uuid: 5316b675dea841898fb0230ffc65f4ac
        name: 'Interface {#IFNAME}: Traffic'
        graph_items:
        - color: 1A7C11
          item:
            host: Cisco Secure Firewall Secure Firewall 1220CX by SNMP
            key: net.if.in[{#SNMPINDEX}]
        - sortorder: '1'
          color: 2774A4
          item:
            host: Cisco Secure Firewall Secure Firewall 1220CX by SNMP
            key: net.if.out[{#SNMPINDEX}]
      - uuid: 6dfdbdd6feed425b83e2c5dcbd1b9486
        name: 'Interface {#IFNAME}: Errors and discards'
        graph_items:
        - color: F63100
          item:
            host: Cisco Secure Firewall Secure Firewall 1220CX by SNMP
            key: net.if.in.errors[{#SNMPINDEX}]
        - sortorder: '1'
          color: A54F10
          item:
            host: Cisco Secure Firewall Secure Firewall 1220CX by SNMP
            key: net.if.out.errors[{#SNMPINDEX}]
        - sortorder: '2'
          color: 7554A1
          item:
            host: Cisco Secure Firewall Secure Firewall 1220CX by SNMP
            key: net.if.in.discards[{#SNMPINDEX}]
        - sortorder: '3'
          color: E075C7
          item:
            host: Cisco Secure Firewall Secure Firewall 1220CX by SNMP
            key: net.if.out.discards[{#SNMPINDEX}]
    tags:
    - tag: class
      value: network
    - tag: target
      value: firewall
    - tag: vendor
      value: Cisco Secure Firewall
    - tag: model
      value: Secure Firewall 1220CX
    valuemaps:
    - uuid: d0f914fcf770450d87396d2525561b00
      name: Interface status
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
      - value: '4'
        newvalue: unknown
      - value: '5'
        newvalue: dormant
      - value: '6'
        newvalue: notPresent
      - value: '7'
        newvalue: lowerLayerDown
