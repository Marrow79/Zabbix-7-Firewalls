zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: e2d55051913841a49e0e04e22cd777b8
    template: Zyxel USG FLEX 100AX by SNMP
    name: Zyxel USG FLEX 100AX by SNMP
    description: 'Zabbix 7.0 SNMP template for Zyxel USG FLEX 100AX.


      Scope: conservative vendor-neutral SNMP baseline using SNMPv2-MIB and IF-MIB so the template remains portable across
      firmware revisions.

      Includes ICMP reachability, system identity/uptime, interface discovery, interface state, traffic, errors/discards,
      triggers, and interface graph prototypes.

      No unverified proprietary OIDs are included. Add vendor MIB-specific items only after confirming them against the exact
      firmware/model.


      SNMP support/model evidence:

      - https://www.zyxel.com/us/en-us/products/firewall-ngfw

      - https://community.zyxel.com/en/discussion/18671/nebula-firewall-matrix-table-zld5-41-uos1-36'
    groups:
    - name: Templates/Network devices
    items:
    - uuid: f548aeec48b34dcda5a3e2b70f339efb
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      delay: 1m
      history: 7d
      trends: 365d
      value_type: UNSIGNED
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 16abad5ea6c647f99dca0c9535ba820b
        expression: max(/Zyxel USG FLEX 100AX by SNMP/icmpping,#3)=0
        name: Firewall is unreachable by ICMP
        priority: HIGH
        manual_close: 'YES'
    - uuid: 5be188a429374a70b90146dae8f17751
      name: ICMP packet loss
      type: SIMPLE
      key: icmppingloss
      delay: 1m
      history: 7d
      trends: 365d
      value_type: FLOAT
      units: '%'
      tags:
      - tag: component
        value: health
    - uuid: f5050dc1186b48d48c517262e677f425
      name: ICMP response time
      type: SIMPLE
      key: icmppingsec
      delay: 1m
      history: 7d
      trends: 365d
      value_type: FLOAT
      units: s
      tags:
      - tag: component
        value: health
    - uuid: c18a6e28d461464a91f4fa3b3953f60b
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: system.descr[sysDescr.0]
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: system
    - uuid: 03b706c49cf043af8248fbd218e36a89
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: system.objectid[sysObjectID.0]
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
    - uuid: a38943bb23914a8189ed448252a071cc
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: system.uptime[sysUpTime.0]
      delay: 5m
      history: 7d
      trends: 365d
      value_type: UNSIGNED
      units: uptime
      tags:
      - tag: component
        value: system
    - uuid: b349b43ad28f4103a4073ca25b4bcdb1
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: system.contact[sysContact.0]
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
    - uuid: a69265cd5df34f03baebdda6e9db27b1
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: system.name[sysName.0]
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
    - uuid: 36814045e462444fb98a573b1edaf935
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: system.location[sysLocation.0]
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
    discovery_rules:
    - uuid: 07cb0ab025cd4deaaf4e0ff788d67355
      name: Network interfaces discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18]
      key: net.if.discovery
      delay: 1h
      lifetime: 7d
      enabled_lifetime_type: DISABLE_NEVER
      item_prototypes:
      - uuid: 15f68d1b32814bdbaf4c6aab3c366558
        name: 'Interface {#IFNAME}: Administrative status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}
        key: net.if.admin[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        valuemap:
          name: Interface status
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 9741bcc5857b4a489d60be2df97cab58
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}
        key: net.if.oper[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        valuemap:
          name: Interface status
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        trigger_prototypes:
        - uuid: da9b99791cb34b91888232b52d5a1789
          expression: last(/Zyxel USG FLEX 100AX by SNMP/net.if.admin[{#SNMPINDEX}])=1 and last(/Zyxel USG FLEX 100AX by SNMP/net.if.oper[{#SNMPINDEX}])<>1
          name: Interface {#IFNAME} is down
          priority: AVERAGE
          manual_close: 'YES'
      - uuid: 8da4893cc28a4358813375207b17f59f
        name: 'Interface {#IFNAME}: Speed'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}
        key: net.if.speed[{#SNMPINDEX}]
        delay: 5m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: Mbps
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 8f4c55ca100841e8b18906d2dd064675
        name: 'Interface {#IFNAME}: Bits received'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}
        key: net.if.in[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: fdf40483d1dc427d98ad88932d611af0
        name: 'Interface {#IFNAME}: Bits sent'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}
        key: net.if.out[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 0bf00ac32318435cb7b5e652801d94a8
        name: 'Interface {#IFNAME}: Inbound errors'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}
        key: net.if.in.errors[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 4a35d2e4e3d64b0180bf472895841658
        name: 'Interface {#IFNAME}: Outbound errors'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}
        key: net.if.out.errors[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 8862e534eb8343c897723e2cb43e4c92
        name: 'Interface {#IFNAME}: Inbound discards'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}
        key: net.if.in.discards[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: e7e8554849544de3aa3da253faae0281
        name: 'Interface {#IFNAME}: Outbound discards'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}
        key: net.if.out.discards[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      graph_prototypes:
      - uuid: fa8b138bc1d24a63950c5a237d7ff2d1
        name: 'Interface {#IFNAME}: Traffic'
        graph_items:
        - color: 1A7C11
          item:
            host: Zyxel USG FLEX 100AX by SNMP
            key: net.if.in[{#SNMPINDEX}]
        - sortorder: '1'
          color: 2774A4
          item:
            host: Zyxel USG FLEX 100AX by SNMP
            key: net.if.out[{#SNMPINDEX}]
      - uuid: b2aa16029fe543e39cfd3a3ac0e83d1c
        name: 'Interface {#IFNAME}: Errors and discards'
        graph_items:
        - color: F63100
          item:
            host: Zyxel USG FLEX 100AX by SNMP
            key: net.if.in.errors[{#SNMPINDEX}]
        - sortorder: '1'
          color: A54F10
          item:
            host: Zyxel USG FLEX 100AX by SNMP
            key: net.if.out.errors[{#SNMPINDEX}]
        - sortorder: '2'
          color: 7554A1
          item:
            host: Zyxel USG FLEX 100AX by SNMP
            key: net.if.in.discards[{#SNMPINDEX}]
        - sortorder: '3'
          color: E075C7
          item:
            host: Zyxel USG FLEX 100AX by SNMP
            key: net.if.out.discards[{#SNMPINDEX}]
    tags:
    - tag: class
      value: network
    - tag: target
      value: firewall
    - tag: vendor
      value: Zyxel
    - tag: model
      value: USG FLEX 100AX
    valuemaps:
    - uuid: c3f7ece80ac34203a42f86743bf11834
      name: Interface status
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
      - value: '4'
        newvalue: unknown
      - value: '5'
        newvalue: dormant
      - value: '6'
        newvalue: notPresent
      - value: '7'
        newvalue: lowerLayerDown
