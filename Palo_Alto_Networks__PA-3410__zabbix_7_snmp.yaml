zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: 82e0bd80d16d45cdadc5622b3ef02fe6
    template: Palo Alto Networks PA-3410 by SNMP
    name: Palo Alto Networks PA-3410 by SNMP
    description: 'Zabbix 7.0 SNMP template for Palo Alto Networks PA-3410.


      Scope: conservative vendor-neutral SNMP baseline using SNMPv2-MIB and IF-MIB so the template remains portable across
      firmware revisions.

      Includes ICMP reachability, system identity/uptime, interface discovery, interface state, traffic, errors/discards,
      triggers, and interface graph prototypes.

      No unverified proprietary OIDs are included. Add vendor MIB-specific items only after confirming them against the exact
      firmware/model.


      SNMP support/model evidence:

      - https://docs.paloaltonetworks.com/hardware

      - https://docs.paloaltonetworks.com/pan-os/11-1/pan-os-admin/monitoring/snmp-monitoring-and-traps/snmp-support'
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 7387743231ca407583473d86828ca3e3
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      delay: 1m
      history: 7d
      trends: 365d
      value_type: UNSIGNED
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 1e2d7c04b63040b58942092986f89221
        expression: max(/Palo Alto Networks PA-3410 by SNMP/icmpping,#3)=0
        name: Firewall is unreachable by ICMP
        priority: HIGH
        manual_close: 'YES'
    - uuid: 3065e632ea2d42c3a8a0931b5a205628
      name: ICMP packet loss
      type: SIMPLE
      key: icmppingloss
      delay: 1m
      history: 7d
      trends: 365d
      value_type: FLOAT
      units: '%'
      tags:
      - tag: component
        value: health
    - uuid: ca72ef1ddc964c36a1e38e2abdefb431
      name: ICMP response time
      type: SIMPLE
      key: icmppingsec
      delay: 1m
      history: 7d
      trends: 365d
      value_type: FLOAT
      units: s
      tags:
      - tag: component
        value: health
    - uuid: 851ffe1dfaf74e05a6f71870a61fe4ac
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: system.descr[sysDescr.0]
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: system
    - uuid: 4fcab87846d540d181a7251b06611f20
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: system.objectid[sysObjectID.0]
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
    - uuid: 6b39e83478864f5687b8b32d49d10dc7
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: system.uptime[sysUpTime.0]
      delay: 5m
      history: 7d
      trends: 365d
      value_type: UNSIGNED
      units: uptime
      tags:
      - tag: component
        value: system
    - uuid: a64e2cd29d3d4fe2a387ad41c27c901f
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: system.contact[sysContact.0]
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
    - uuid: 77d0ad11638940aaafe8db99e638577e
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: system.name[sysName.0]
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
    - uuid: a00ab0b54db44128b22c9c9eb718b060
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: system.location[sysLocation.0]
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
    discovery_rules:
    - uuid: 18c8374eeaf54403b3f104db5c3edfe6
      name: Network interfaces discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18]
      key: net.if.discovery
      delay: 1h
      lifetime: 7d
      enabled_lifetime_type: DISABLE_NEVER
      item_prototypes:
      - uuid: b81ed0158b924c4a9a754a0cdf0cf30a
        name: 'Interface {#IFNAME}: Administrative status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}
        key: net.if.admin[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        valuemap:
          name: Interface status
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: bc1aeba223864ecca73293fb65d72269
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}
        key: net.if.oper[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        valuemap:
          name: Interface status
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        trigger_prototypes:
        - uuid: 493fefe4570f48b4a8ad52bc67966694
          expression: last(/Palo Alto Networks PA-3410 by SNMP/net.if.admin[{#SNMPINDEX}])=1 and last(/Palo Alto Networks
            PA-3410 by SNMP/net.if.oper[{#SNMPINDEX}])<>1
          name: Interface {#IFNAME} is down
          priority: AVERAGE
          manual_close: 'YES'
      - uuid: 9b8c0c2fc1514b379414a660ecfab3dd
        name: 'Interface {#IFNAME}: Speed'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}
        key: net.if.speed[{#SNMPINDEX}]
        delay: 5m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: Mbps
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 4e0b5af13ebb4aff99b32a64683f8f78
        name: 'Interface {#IFNAME}: Bits received'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}
        key: net.if.in[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: c9621974ca844d9bb4504d46e7a8eebb
        name: 'Interface {#IFNAME}: Bits sent'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}
        key: net.if.out[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 74ce78e90f0c41ec855e7d57c34dcfa7
        name: 'Interface {#IFNAME}: Inbound errors'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}
        key: net.if.in.errors[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 2e85326d733740febb4a6de695c4b49e
        name: 'Interface {#IFNAME}: Outbound errors'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}
        key: net.if.out.errors[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 1461a24f9d394ffd922fe715a51f5b78
        name: 'Interface {#IFNAME}: Inbound discards'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}
        key: net.if.in.discards[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: fbf723ad67a34b35b6ff2690c5e97de5
        name: 'Interface {#IFNAME}: Outbound discards'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}
        key: net.if.out.discards[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      graph_prototypes:
      - uuid: 344c9ee85c164982ba0fef3aee25b982
        name: 'Interface {#IFNAME}: Traffic'
        graph_items:
        - color: 1A7C11
          item:
            host: Palo Alto Networks PA-3410 by SNMP
            key: net.if.in[{#SNMPINDEX}]
        - sortorder: '1'
          color: 2774A4
          item:
            host: Palo Alto Networks PA-3410 by SNMP
            key: net.if.out[{#SNMPINDEX}]
      - uuid: a38d34c635c843db969ea6346029d526
        name: 'Interface {#IFNAME}: Errors and discards'
        graph_items:
        - color: F63100
          item:
            host: Palo Alto Networks PA-3410 by SNMP
            key: net.if.in.errors[{#SNMPINDEX}]
        - sortorder: '1'
          color: A54F10
          item:
            host: Palo Alto Networks PA-3410 by SNMP
            key: net.if.out.errors[{#SNMPINDEX}]
        - sortorder: '2'
          color: 7554A1
          item:
            host: Palo Alto Networks PA-3410 by SNMP
            key: net.if.in.discards[{#SNMPINDEX}]
        - sortorder: '3'
          color: E075C7
          item:
            host: Palo Alto Networks PA-3410 by SNMP
            key: net.if.out.discards[{#SNMPINDEX}]
    tags:
    - tag: class
      value: network
    - tag: target
      value: firewall
    - tag: vendor
      value: Palo Alto Networks
    - tag: model
      value: PA-3410
    valuemaps:
    - uuid: 2528e4cff94a490a9ffe081443e9a611
      name: Interface status
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
      - value: '4'
        newvalue: unknown
      - value: '5'
        newvalue: dormant
      - value: '6'
        newvalue: notPresent
      - value: '7'
        newvalue: lowerLayerDown
