zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: afe5b65929d74f1e8ed6d2f6c5aaa9cd
    template: Cisco Secure Firewall Secure Firewall 3140 by SNMP
    name: Cisco Secure Firewall Secure Firewall 3140 by SNMP
    description: 'Zabbix 7.0 SNMP template for Cisco Secure Firewall Secure Firewall 3140.


      Scope: conservative vendor-neutral SNMP baseline using SNMPv2-MIB and IF-MIB so the template remains portable across
      firmware revisions.

      Includes ICMP reachability, system identity/uptime, interface discovery, interface state, traffic, errors/discards,
      triggers, and interface graph prototypes.

      No unverified proprietary OIDs are included. Add vendor MIB-specific items only after confirming them against the exact
      firmware/model.


      SNMP support/model evidence:

      - https://www.cisco.com/site/ca/en/products/security/firewalls/index.html

      - https://www.cisco.com/c/en/us/td/docs/security/secure-firewall/mib/cisco-secure-firewall-mib-reference-guide.html'
    groups:
    - name: Templates/Network devices
    items:
    - uuid: 388c2957c6924a3398c2ad267c96452a
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      delay: 1m
      history: 7d
      trends: 365d
      value_type: UNSIGNED
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: e67a85e8ac7f4090b5d6a1a325bd923a
        expression: max(/Cisco Secure Firewall Secure Firewall 3140 by SNMP/icmpping,#3)=0
        name: Firewall is unreachable by ICMP
        priority: HIGH
        manual_close: 'YES'
    - uuid: d744c7612df942778a9cc2e2dd7307dd
      name: ICMP packet loss
      type: SIMPLE
      key: icmppingloss
      delay: 1m
      history: 7d
      trends: 365d
      value_type: FLOAT
      units: '%'
      tags:
      - tag: component
        value: health
    - uuid: b41875f1d610481988a144dcc0c3503b
      name: ICMP response time
      type: SIMPLE
      key: icmppingsec
      delay: 1m
      history: 7d
      trends: 365d
      value_type: FLOAT
      units: s
      tags:
      - tag: component
        value: health
    - uuid: 417cb7e5979640c7a1a7e3ea68830ca8
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: system.descr[sysDescr.0]
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: system
    - uuid: d4be761227684dab9362692d30af6c78
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: system.objectid[sysObjectID.0]
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
    - uuid: 902162feb0d34c528dc294f570a14132
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: system.uptime[sysUpTime.0]
      delay: 5m
      history: 7d
      trends: 365d
      value_type: UNSIGNED
      units: uptime
      tags:
      - tag: component
        value: system
    - uuid: 68951f1a1ec7476a8cfa147d0f69d224
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: system.contact[sysContact.0]
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
    - uuid: 0bf0dd7e818f40d8bda6c878bdb1afad
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: system.name[sysName.0]
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
    - uuid: 03ec3dbf33e34f419d72d132e931d708
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: system.location[sysLocation.0]
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
    discovery_rules:
    - uuid: f6e86914ec0541a79db4452c60f9973b
      name: Network interfaces discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18]
      key: net.if.discovery
      delay: 1h
      lifetime: 7d
      enabled_lifetime_type: DISABLE_NEVER
      item_prototypes:
      - uuid: 4238c536782040f191e10a045a9d8a85
        name: 'Interface {#IFNAME}: Administrative status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}
        key: net.if.admin[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        valuemap:
          name: Interface status
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 3fae4ccd418341e6934b5d7ce58eaf1f
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}
        key: net.if.oper[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        valuemap:
          name: Interface status
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        trigger_prototypes:
        - uuid: ff005b937df349e6b5b9d566b85fbe17
          expression: last(/Cisco Secure Firewall Secure Firewall 3140 by SNMP/net.if.admin[{#SNMPINDEX}])=1 and last(/Cisco
            Secure Firewall Secure Firewall 3140 by SNMP/net.if.oper[{#SNMPINDEX}])<>1
          name: Interface {#IFNAME} is down
          priority: AVERAGE
          manual_close: 'YES'
      - uuid: 7ca729b6d4ce446282171869ba4f8f72
        name: 'Interface {#IFNAME}: Speed'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}
        key: net.if.speed[{#SNMPINDEX}]
        delay: 5m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: Mbps
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: ef6b0da23992470cac289e53db7ceb5f
        name: 'Interface {#IFNAME}: Bits received'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}
        key: net.if.in[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 3fa8ddbde1a94500a8d964c73c7c9d4d
        name: 'Interface {#IFNAME}: Bits sent'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}
        key: net.if.out[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 58ebead126b340648766781c17dec103
        name: 'Interface {#IFNAME}: Inbound errors'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}
        key: net.if.in.errors[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: cdea398ee87f4ebcaec14d3627ff913c
        name: 'Interface {#IFNAME}: Outbound errors'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}
        key: net.if.out.errors[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 7a473d10a49241f79fd89fdea6074bf5
        name: 'Interface {#IFNAME}: Inbound discards'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}
        key: net.if.in.discards[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 130638ad4d99454797b1d1addb6efc7f
        name: 'Interface {#IFNAME}: Outbound discards'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}
        key: net.if.out.discards[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      graph_prototypes:
      - uuid: 57c100d894864f3bb7d0d8f22e982db1
        name: 'Interface {#IFNAME}: Traffic'
        graph_items:
        - color: 1A7C11
          item:
            host: Cisco Secure Firewall Secure Firewall 3140 by SNMP
            key: net.if.in[{#SNMPINDEX}]
        - sortorder: '1'
          color: 2774A4
          item:
            host: Cisco Secure Firewall Secure Firewall 3140 by SNMP
            key: net.if.out[{#SNMPINDEX}]
      - uuid: 6235793e52e94747863877a29f453790
        name: 'Interface {#IFNAME}: Errors and discards'
        graph_items:
        - color: F63100
          item:
            host: Cisco Secure Firewall Secure Firewall 3140 by SNMP
            key: net.if.in.errors[{#SNMPINDEX}]
        - sortorder: '1'
          color: A54F10
          item:
            host: Cisco Secure Firewall Secure Firewall 3140 by SNMP
            key: net.if.out.errors[{#SNMPINDEX}]
        - sortorder: '2'
          color: 7554A1
          item:
            host: Cisco Secure Firewall Secure Firewall 3140 by SNMP
            key: net.if.in.discards[{#SNMPINDEX}]
        - sortorder: '3'
          color: E075C7
          item:
            host: Cisco Secure Firewall Secure Firewall 3140 by SNMP
            key: net.if.out.discards[{#SNMPINDEX}]
    tags:
    - tag: class
      value: network
    - tag: target
      value: firewall
    - tag: vendor
      value: Cisco Secure Firewall
    - tag: model
      value: Secure Firewall 3140
    valuemaps:
    - uuid: b04a1f39ffe249029f0c14d68b15ed20
      name: Interface status
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
      - value: '4'
        newvalue: unknown
      - value: '5'
        newvalue: dormant
      - value: '6'
        newvalue: notPresent
      - value: '7'
        newvalue: lowerLayerDown
