zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 36bff6c29af64692839d077febfc7079
    name: Templates/Network devices
  templates:
  - uuid: 4b290fa4385446a6a4dd6c33b1c95d76
    template: SonicWall NSv 270 by SNMP
    name: SonicWall NSv 270 by SNMP
    description: 'Zabbix 7.0 SNMP template for SonicWall NSv 270.


      Scope: conservative vendor-neutral SNMP baseline using SNMPv2-MIB and IF-MIB so the template remains portable across
      firmware revisions.

      Includes ICMP reachability, system identity/uptime, interface discovery, interface state, traffic, errors/discards,
      triggers, and interface graph prototypes.

      No unverified proprietary OIDs are included. Add vendor MIB-specific items only after confirming them against the exact
      firmware/model.


      SNMP support/model evidence:

      - https://www.sonicwall.com/support/technical-documentation/docs/sonicos8-device-settings/Content/SNMP/group-creating.htm

      - https://www.sonicwall.com/es-mx/support/knowledge-base/sonicwall-gen8-tzs-and-gen8-nsas-settings-migration/kA1VN0000000RrR0AU

      - https://www.sonicwall.com/support/technical-documentation/docs/sonicos-7-0-0-0-release_notes/Content/Versions/sonicos-7-0-1-13-5161.htm


      Vendor note:

      SonicOS SNMP is disabled by default. Enable SNMP and permit SNMP management on the appropriate interface/zone.'
    groups:
    - name: Templates/Network devices
    items:
    - uuid: f758c4435ebf480ea09b6c78b1830546
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      delay: 1m
      history: 7d
      trends: 365d
      value_type: UNSIGNED
      tags:
      - tag: component
        value: health
      triggers:
      - uuid: 84fcf241e8914b679ff4b132b4093c73
        expression: max(/SonicWall NSv 270 by SNMP/icmpping,#3)=0
        name: Firewall is unreachable by ICMP
        priority: HIGH
        manual_close: 'YES'
    - uuid: d92d774ba37e4320a481d0fc71b595aa
      name: ICMP packet loss
      type: SIMPLE
      key: icmppingloss
      delay: 1m
      history: 7d
      trends: 365d
      value_type: FLOAT
      units: '%'
      tags:
      - tag: component
        value: health
    - uuid: 1aaad11cbaa64c2d8f1dc285844741a1
      name: ICMP response time
      type: SIMPLE
      key: icmppingsec
      delay: 1m
      history: 7d
      trends: 365d
      value_type: FLOAT
      units: s
      tags:
      - tag: component
        value: health
    - uuid: 2600ad67a3d6439094bd39eb4b3f69d2
      name: System description
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.1.0
      key: system.descr[sysDescr.0]
      delay: 1h
      history: 7d
      trends: '0'
      value_type: TEXT
      tags:
      - tag: component
        value: system
    - uuid: b99f74c0883f48cda1dfcccb9aad2ec0
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.2.0
      key: system.objectid[sysObjectID.0]
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
    - uuid: dd3d8e8957f2464eb1deb35888ab5ff0
      name: System uptime
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.3.0
      key: system.uptime[sysUpTime.0]
      delay: 5m
      history: 7d
      trends: 365d
      value_type: UNSIGNED
      units: uptime
      tags:
      - tag: component
        value: system
    - uuid: 29bbaa3a27e84a658856ecafba221bdb
      name: System contact
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.4.0
      key: system.contact[sysContact.0]
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
    - uuid: 08aa2050eb8c432ba8dc89e9eea182d9
      name: System name
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.5.0
      key: system.name[sysName.0]
      delay: 10m
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
    - uuid: c68eb9131128409b9f5e69207447d6d3
      name: System location
      type: SNMP_AGENT
      snmp_oid: 1.3.6.1.2.1.1.6.0
      key: system.location[sysLocation.0]
      delay: 1h
      history: 7d
      trends: '0'
      value_type: CHAR
      tags:
      - tag: component
        value: system
    discovery_rules:
    - uuid: 50fc04b9f0984592b26205a9d70a63cb
      name: Network interfaces discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18]
      key: net.if.discovery
      delay: 1h
      lifetime: 7d
      enabled_lifetime_type: DISABLE_NEVER
      item_prototypes:
      - uuid: 15a16975d5a844fe89962ab606c3e85c
        name: 'Interface {#IFNAME}: Administrative status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.7.{#SNMPINDEX}
        key: net.if.admin[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        valuemap:
          name: Interface status
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 634f5e8cf22d4f7aa9673bc9bb8277e5
        name: 'Interface {#IFNAME}: Operational status'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}
        key: net.if.oper[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        valuemap:
          name: Interface status
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
        trigger_prototypes:
        - uuid: f45604cc47e54c1d8051cfc42789db0d
          expression: last(/SonicWall NSv 270 by SNMP/net.if.admin[{#SNMPINDEX}])=1 and last(/SonicWall NSv 270 by SNMP/net.if.oper[{#SNMPINDEX}])<>1
          name: Interface {#IFNAME} is down
          priority: AVERAGE
          manual_close: 'YES'
      - uuid: cb46921a44094ea3bfd472fffa630054
        name: 'Interface {#IFNAME}: Speed'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}
        key: net.if.speed[{#SNMPINDEX}]
        delay: 5m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: Mbps
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: d7c9cf10dd1a4434a71f615e36ef1274
        name: 'Interface {#IFNAME}: Bits received'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}
        key: net.if.in[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 8ad42af6681f4083aac79fb4919daef2
        name: 'Interface {#IFNAME}: Bits sent'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}
        key: net.if.out[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: bps
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 6a2ebae727304dad8315ba0fe5e852c9
        name: 'Interface {#IFNAME}: Inbound errors'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}
        key: net.if.in.errors[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 6df6f319d7db413882b0f44a55ae2a78
        name: 'Interface {#IFNAME}: Outbound errors'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}
        key: net.if.out.errors[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: bcaccc2ad04d42248a0b3b11428e5e36
        name: 'Interface {#IFNAME}: Inbound discards'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}
        key: net.if.in.discards[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      - uuid: a5a202f08f34477e832559070da5c6f9
        name: 'Interface {#IFNAME}: Outbound discards'
        type: SNMP_AGENT
        snmp_oid: 1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}
        key: net.if.out.discards[{#SNMPINDEX}]
        delay: 1m
        history: 7d
        trends: 365d
        value_type: UNSIGNED
        units: pps
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: interface
        - tag: interface
          value: '{#IFNAME}'
      graph_prototypes:
      - uuid: 60c4cf2cea814a1d8d67c22257d457a6
        name: 'Interface {#IFNAME}: Traffic'
        graph_items:
        - color: 1A7C11
          item:
            host: SonicWall NSv 270 by SNMP
            key: net.if.in[{#SNMPINDEX}]
        - sortorder: '1'
          color: 2774A4
          item:
            host: SonicWall NSv 270 by SNMP
            key: net.if.out[{#SNMPINDEX}]
      - uuid: 5cd896fcfca843909e8246bf9c0eadb6
        name: 'Interface {#IFNAME}: Errors and discards'
        graph_items:
        - color: F63100
          item:
            host: SonicWall NSv 270 by SNMP
            key: net.if.in.errors[{#SNMPINDEX}]
        - sortorder: '1'
          color: A54F10
          item:
            host: SonicWall NSv 270 by SNMP
            key: net.if.out.errors[{#SNMPINDEX}]
        - sortorder: '2'
          color: 7554A1
          item:
            host: SonicWall NSv 270 by SNMP
            key: net.if.in.discards[{#SNMPINDEX}]
        - sortorder: '3'
          color: E075C7
          item:
            host: SonicWall NSv 270 by SNMP
            key: net.if.out.discards[{#SNMPINDEX}]
    tags:
    - tag: class
      value: network
    - tag: target
      value: firewall
    - tag: vendor
      value: SonicWall
    - tag: model
      value: NSv 270
    valuemaps:
    - uuid: 0fbd28857420436da7d70e482e594130
      name: Interface status
      mappings:
      - value: '1'
        newvalue: up
      - value: '2'
        newvalue: down
      - value: '3'
        newvalue: testing
      - value: '4'
        newvalue: unknown
      - value: '5'
        newvalue: dormant
      - value: '6'
        newvalue: notPresent
      - value: '7'
        newvalue: lowerLayerDown
